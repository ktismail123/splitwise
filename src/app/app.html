<!-- Modern Mobile-First Main Layout -->
<div class="min-h-screen bg-gray-50">
  
  <!-- Header -->
  <header class="bg-white border-b border-gray-100 sticky top-0 z-50 backdrop-blur-lg bg-white/80">
    <div class="container mx-auto px-4 py-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-600/20">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
            </svg>
          </div>
          <div>
            <h1 class="text-xl md:text-2xl font-bold text-gray-900">Zettly</h1>
            <p class="text-xs text-gray-500 hidden md:block">Settle, Share, Simplify.</p>
          </div>
        </div>
        
        <!-- Menu Button (Mobile) -->
        <!-- <button class="md:hidden w-10 h-10 flex items-center justify-center rounded-xl hover:bg-gray-100 transition-colors">
          <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button> -->
      </div>
    </div>
  </header>

  <div class="container mx-auto px-4 py-6 md:py-8 max-w-4xl">
    
    <!-- Progress Steps - Mobile Optimized -->
    <div class="mb-8">
      <!-- Mobile Progress Bar -->
      <div class="md:hidden mb-6">
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-medium text-indigo-600">Step {{currentStep}} of 4</span>
          <span class="text-xs text-gray-500">
            {{currentStep === 1 ? 'Event Details' : currentStep === 2 ? 'Add People' : currentStep === 3 ? 'Add Payments' : 'Summary'}}
          </span>
        </div>
        <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
          <div class="h-full bg-gradient-to-r from-indigo-500 to-indigo-600 rounded-full transition-all duration-500" 
               [style.width.%]="(currentStep / 4) * 100"></div>
        </div>
      </div>

      <!-- Desktop Progress Steps -->
      <div class="hidden md:flex justify-between items-center relative">
        <!-- Background line -->
        <div class="absolute top-5 left-0 right-0 h-0.5 bg-gray-200 -z-10"></div>
        <div class="absolute top-5 left-0 h-0.5 bg-indigo-600 -z-10 transition-all duration-500" 
             [style.width.%]="((currentStep - 1) / 3) * 100"></div>

        <!-- Step 1 -->
        <div class="flex flex-col items-center">
          <div class="w-11 h-11 rounded-full flex items-center justify-center font-bold transition-all duration-300 shadow-sm"
               [class.bg-indigo-600]="currentStep >= 1"
               [class.text-white]="currentStep >= 1"
               [class.shadow-indigo-600/20]="currentStep >= 1"
               [class.bg-white]="currentStep < 1"
               [class.text-gray-400]="currentStep < 1"
               [class.border-2]="currentStep < 1"
               [class.border-gray-200]="currentStep < 1">
            <svg *ngIf="currentStep > 1" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
            </svg>
            <span *ngIf="currentStep <= 1">1</span>
          </div>
          <span class="text-xs mt-2 font-medium"
                [class.text-indigo-600]="currentStep >= 1"
                [class.text-gray-500]="currentStep < 1">
            Event
          </span>
        </div>

        <!-- Step 2 -->
        <div class="flex flex-col items-center">
          <div class="w-11 h-11 rounded-full flex items-center justify-center font-bold transition-all duration-300 shadow-sm"
               [class.bg-indigo-600]="currentStep >= 2"
               [class.text-white]="currentStep >= 2"
               [class.shadow-indigo-600/20]="currentStep >= 2"
               [class.bg-white]="currentStep < 2"
               [class.text-gray-400]="currentStep < 2"
               [class.border-2]="currentStep < 2"
               [class.border-gray-200]="currentStep < 2">
            <svg *ngIf="currentStep > 2" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
            </svg>
            <span *ngIf="currentStep <= 2">2</span>
          </div>
          <span class="text-xs mt-2 font-medium"
                [class.text-indigo-600]="currentStep >= 2"
                [class.text-gray-500]="currentStep < 2">
            People
          </span>
        </div>

        <!-- Step 3 -->
        <div class="flex flex-col items-center">
          <div class="w-11 h-11 rounded-full flex items-center justify-center font-bold transition-all duration-300 shadow-sm"
               [class.bg-indigo-600]="currentStep >= 3"
               [class.text-white]="currentStep >= 3"
               [class.shadow-indigo-600/20]="currentStep >= 3"
               [class.bg-white]="currentStep < 3"
               [class.text-gray-400]="currentStep < 3"
               [class.border-2]="currentStep < 3"
               [class.border-gray-200]="currentStep < 3">
            <svg *ngIf="currentStep > 3" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
            </svg>
            <span *ngIf="currentStep <= 3">3</span>
          </div>
          <span class="text-xs mt-2 font-medium"
                [class.text-indigo-600]="currentStep >= 3"
                [class.text-gray-500]="currentStep < 3">
            Payments
          </span>
        </div>

        <!-- Step 4 -->
        <div class="flex flex-col items-center">
          <div class="w-11 h-11 rounded-full flex items-center justify-center font-bold transition-all duration-300 shadow-sm"
               [class.bg-indigo-600]="currentStep >= 4"
               [class.text-white]="currentStep >= 4"
               [class.shadow-indigo-600/20]="currentStep >= 4"
               [class.bg-white]="currentStep < 4"
               [class.text-gray-400]="currentStep < 4"
               [class.border-2]="currentStep < 4"
               [class.border-gray-200]="currentStep < 4">
            4
          </div>
          <span class="text-xs mt-2 font-medium"
                [class.text-indigo-600]="currentStep >= 4"
                [class.text-gray-500]="currentStep < 4">
            Summary
          </span>
        </div>
      </div>
    </div>

    <!-- Router Outlet -->
    <router-outlet></router-outlet>
    
  </div>

  <!-- Footer -->
  <footer class="bg-white border-t border-gray-100">
    <div class="container mx-auto px-4 py-6 text-center">
      <p class="text-sm text-gray-500">Powered by Zettly App</p>
    </div>
  </footer>

</div>
