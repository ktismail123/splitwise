<!-- Clean Mobile-First Main Layout -->
<div class="bg-gray-50">
  
  <!-- Simple Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 bg-gradient-to-br from-green-400 to-green-500 rounded-xl flex items-center justify-center shadow-lg shadow-green-500/30">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
            </svg>
          </div>
          <h1 class="text-lg font-semibold text-gray-900">Zettly</h1>
        </div>
      </div>
    </div>
  </header>

  <div class="max-w-4xl mx-auto px-4 py-4">
    
    <!-- Clean Progress Steps -->
    <div class="mb-4">
      
      <!-- Mobile Progress -->
      <div class="md:hidden mb-3">
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-xs font-medium text-gray-900">Step {{currentStep}} of 4</span>
          <span class="text-xs text-gray-500">
            {{currentStep === 1 ? 'Event Details' : currentStep === 2 ? 'Add People' : currentStep === 3 ? 'Add Payments' : 'Summary'}}
          </span>
        </div>
        <div class="h-1 bg-gray-200 rounded-full overflow-hidden">
          <div class="h-full bg-gradient-to-r from-green-400 to-green-500 rounded-full transition-all duration-300" 
               [style.width.%]="(currentStep / 4) * 100"></div>
        </div>
      </div>

      <!-- Desktop Steps -->
      <div class="hidden md:flex justify-between items-center relative max-w-2xl mx-auto">
        <!-- Progress Line -->
        <div class="absolute top-4 left-0 right-0 h-0.5 bg-gray-200"></div>
        <div class="absolute top-4 left-0 h-0.5 bg-gradient-to-r from-green-400 to-green-500 transition-all duration-300" 
             [style.width.%]="((currentStep - 1) / 3) * 100"></div>

        <!-- Step 1: Event -->
        <div class="flex flex-col items-center relative bg-gray-50 z-10">
          <div class="w-9 h-9 rounded-full flex items-center justify-center font-semibold text-sm transition-all"
               [class.bg-gradient-to-br]="currentStep >= 1"
               [class.from-green-400]="currentStep >= 1"
               [class.to-green-500]="currentStep >= 1"
               [class.shadow-lg]="currentStep >= 1"
               [class.shadow-green-500/30]="currentStep >= 1"
               [class.text-white]="currentStep >= 1"
               [class.bg-white]="currentStep < 1"
               [class.text-gray-400]="currentStep < 1"
               [class.border-2]="currentStep < 1"
               [class.border-gray-300]="currentStep < 1">
            <svg *ngIf="currentStep > 1" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
            </svg>
            <span *ngIf="currentStep <= 1">1</span>
          </div>
          <span class="text-xs mt-2 font-medium"
                [class.text-green-600]="currentStep >= 1"
                [class.text-gray-400]="currentStep < 1">
            Event
          </span>
        </div>

        <!-- Step 2: People -->
        <div class="flex flex-col items-center relative bg-gray-50 z-10">
          <div class="w-9 h-9 rounded-full flex items-center justify-center font-semibold text-sm transition-all"
               [class.bg-gradient-to-br]="currentStep >= 2"
               [class.from-green-400]="currentStep >= 2"
               [class.to-green-500]="currentStep >= 2"
               [class.shadow-lg]="currentStep >= 2"
               [class.shadow-green-500/30]="currentStep >= 2"
               [class.text-white]="currentStep >= 2"
               [class.bg-white]="currentStep < 2"
               [class.text-gray-400]="currentStep < 2"
               [class.border-2]="currentStep < 2"
               [class.border-gray-300]="currentStep < 2">
            <svg *ngIf="currentStep > 2" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
            </svg>
            <span *ngIf="currentStep <= 2">2</span>
          </div>
          <span class="text-xs mt-2 font-medium"
                [class.text-green-600]="currentStep >= 2"
                [class.text-gray-400]="currentStep < 2">
            People
          </span>
        </div>

        <!-- Step 3: Payments -->
        <div class="flex flex-col items-center relative bg-gray-50 z-10">
          <div class="w-9 h-9 rounded-full flex items-center justify-center font-semibold text-sm transition-all"
               [class.bg-gradient-to-br]="currentStep >= 3"
               [class.from-green-400]="currentStep >= 3"
               [class.to-green-500]="currentStep >= 3"
               [class.shadow-lg]="currentStep >= 3"
               [class.shadow-green-500/30]="currentStep >= 3"
               [class.text-white]="currentStep >= 3"
               [class.bg-white]="currentStep < 3"
               [class.text-gray-400]="currentStep < 3"
               [class.border-2]="currentStep < 3"
               [class.border-gray-300]="currentStep < 3">
            <svg *ngIf="currentStep > 3" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
            </svg>
            <span *ngIf="currentStep <= 3">3</span>
          </div>
          <span class="text-xs mt-2 font-medium"
                [class.text-green-600]="currentStep >= 3"
                [class.text-gray-400]="currentStep < 3">
            Payments
          </span>
        </div>

        <!-- Step 4: Summary -->
        <div class="flex flex-col items-center relative bg-gray-50 z-10">
          <div class="w-9 h-9 rounded-full flex items-center justify-center font-semibold text-sm transition-all"
               [class.bg-gradient-to-br]="currentStep >= 4"
               [class.from-green-400]="currentStep >= 4"
               [class.to-green-500]="currentStep >= 4"
               [class.shadow-lg]="currentStep >= 4"
               [class.shadow-green-500/30]="currentStep >= 4"
               [class.text-white]="currentStep >= 4"
               [class.bg-white]="currentStep < 4"
               [class.text-gray-400]="currentStep < 4"
               [class.border-2]="currentStep < 4"
               [class.border-gray-300]="currentStep < 4">
            4
          </div>
          <span class="text-xs mt-2 font-medium"
                [class.text-green-600]="currentStep >= 4"
                [class.text-gray-400]="currentStep < 4">
            Summary
          </span>
        </div>
      </div>
    </div>

    <!-- Content -->
    <router-outlet></router-outlet>
    
  </div>

  <!-- Simple Footer -->
  <footer class="border-t border-gray-200 mt-6">
    <div class="max-w-4xl mx-auto px-4 py-4 text-center">
      <p class="text-xs text-gray-500">Powered by Zettly</p>
    </div>
  </footer>

</div>
