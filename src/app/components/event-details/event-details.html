<!-- Mobile App Event Creation -->
<div class="bg-gray-50 min-h-screen pb-20">
  
  <!-- App Header -->
  <div class="px-4 py-4 border-gray-200">
    <div class="flex items-center gap-3">
      <button class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center active:scale-95 transition-all">
        <svg class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
        </svg>
      </button>
      <div>
        <h1 class="text-lg font-bold text-gray-900">Create Event</h1>
        <p class="text-xs text-gray-500">Let's get started</p>
      </div>
    </div>
  </div>

  <div class="px-4 py-4">
    
    <!-- Event Name Input -->
    <div class="mb-4">
      <label class="block text-sm font-semibold text-gray-900 mb-2">
        Event Name
      </label>
      <div class="relative">
        <input 
          type="text" 
          [(ngModel)]="eventName"
          placeholder="Trip to Bali, Office Party..."
          class="w-full px-4 py-3.5 text-base bg-white border-2 border-gray-200 rounded-2xl focus:border-green-400 focus:ring-0 outline-none transition-all placeholder:text-gray-400"
        />
        <div class="absolute right-4 top-1/2 -translate-y-1/2">
          <svg *ngIf="eventName.trim()" class="w-5 h-5 text-green-500" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
          </svg>
        </div>
      </div>
    </div>

    <!-- Currency Selection -->
    <div class="mb-6">
      <label class="block text-sm font-semibold text-gray-900 mb-2">
        Currency
      </label>
      
      <div class="grid grid-cols-3 gap-2.5">

        <button 
          type="button"
          (click)="currency = 'AED'"
          [class.border-green-400]="currency === 'AED'"
          [class.bg-green-50]="currency === 'AED'"
          [class.border-gray-200]="currency !== 'AED'"
          [class.bg-white]="currency !== 'AED'"
          class="flex flex-col items-center justify-center p-3.5 rounded-2xl border-2 active:scale-95 transition-all"
        >
          <span class="text-2xl mb-1">🇦🇪</span>
          <span class="text-xs font-bold text-gray-900">AED</span>
        </button>

        <button 
          type="button"
          (click)="currency = 'USD'"
          [class.border-green-400]="currency === 'USD'"
          [class.bg-green-50]="currency === 'USD'"
          [class.border-gray-200]="currency !== 'USD'"
          [class.bg-white]="currency !== 'USD'"
          class="flex flex-col items-center justify-center p-3.5 rounded-2xl border-2 active:scale-95 transition-all"
        >
          <span class="text-2xl mb-1">🇺🇸</span>
          <span class="text-xs font-bold text-gray-900">USD</span>
        </button>

        <button 
          type="button"
          (click)="currency = 'EUR'"
          [class.border-green-400]="currency === 'EUR'"
          [class.bg-green-50]="currency === 'EUR'"
          [class.border-gray-200]="currency !== 'EUR'"
          [class.bg-white]="currency !== 'EUR'"
          class="flex flex-col items-center justify-center p-3.5 rounded-2xl border-2 active:scale-95 transition-all"
        >
          <span class="text-2xl mb-1">🇪🇺</span>
          <span class="text-xs font-bold text-gray-900">EUR</span>
        </button>

        <button 
          type="button"
          (click)="currency = 'GBP'"
          [class.border-green-400]="currency === 'GBP'"
          [class.bg-green-50]="currency === 'GBP'"
          [class.border-gray-200]="currency !== 'GBP'"
          [class.bg-white]="currency !== 'GBP'"
          class="flex flex-col items-center justify-center p-3.5 rounded-2xl border-2 active:scale-95 transition-all"
        >
          <span class="text-2xl mb-1">🇬🇧</span>
          <span class="text-xs font-bold text-gray-900">GBP</span>
        </button>

        <button 
          type="button"
          (click)="currency = 'INR'"
          [class.border-green-400]="currency === 'INR'"
          [class.bg-green-50]="currency === 'INR'"
          [class.border-gray-200]="currency !== 'INR'"
          [class.bg-white]="currency !== 'INR'"
          class="flex flex-col items-center justify-center p-3.5 rounded-2xl border-2 active:scale-95 transition-all"
        >
          <span class="text-2xl mb-1">🇮🇳</span>
          <span class="text-xs font-bold text-gray-900">INR</span>
        </button>

        <button 
          type="button"
          (click)="currency = 'JPY'"
          [class.border-green-400]="currency === 'JPY'"
          [class.bg-green-50]="currency === 'JPY'"
          [class.border-gray-200]="currency !== 'JPY'"
          [class.bg-white]="currency !== 'JPY'"
          class="flex flex-col items-center justify-center p-3.5 rounded-2xl border-2 active:scale-95 transition-all"
        >
          <span class="text-2xl mb-1">🇯🇵</span>
          <span class="text-xs font-bold text-gray-900">JPY</span>
        </button>

        <button 
          type="button"
          (click)="currency = 'CNY'"
          [class.border-green-400]="currency === 'CNY'"
          [class.bg-green-50]="currency === 'CNY'"
          [class.border-gray-200]="currency !== 'CNY'"
          [class.bg-white]="currency !== 'CNY'"
          class="flex flex-col items-center justify-center p-3.5 rounded-2xl border-2 active:scale-95 transition-all"
        >
          <span class="text-2xl mb-1">🇨🇳</span>
          <span class="text-xs font-bold text-gray-900">CNY</span>
        </button>

        <button 
          type="button"
          (click)="currency = 'AUD'"
          [class.border-green-400]="currency === 'AUD'"
          [class.bg-green-50]="currency === 'AUD'"
          [class.border-gray-200]="currency !== 'AUD'"
          [class.bg-white]="currency !== 'AUD'"
          class="flex flex-col items-center justify-center p-3.5 rounded-2xl border-2 active:scale-95 transition-all"
        >
          <span class="text-2xl mb-1">🇦🇺</span>
          <span class="text-xs font-bold text-gray-900">AUD</span>
        </button>

        <button 
          type="button"
          (click)="currency = 'CAD'"
          [class.border-green-400]="currency === 'CAD'"
          [class.bg-green-50]="currency === 'CAD'"
          [class.border-gray-200]="currency !== 'CAD'"
          [class.bg-white]="currency !== 'CAD'"
          class="flex flex-col items-center justify-center p-3.5 rounded-2xl border-2 active:scale-95 transition-all"
        >
          <span class="text-2xl mb-1">🇨🇦</span>
          <span class="text-xs font-bold text-gray-900">CAD</span>
        </button>
      </div>
    </div>

  </div>

  <!-- Bottom Action Bar -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-4 py-4 safe-area-bottom">
    <button 
      (click)="next()"
      [disabled]="!eventName.trim()"
      class="w-full px-6 py-4 bg-gradient-to-br from-green-400 to-green-500 text-white font-bold text-base rounded-2xl hover:from-green-500 hover:to-green-600 active:scale-[0.98] disabled:bg-gray-200 disabled:text-gray-400 disabled:cursor-not-allowed transition-all shadow-lg shadow-green-500/25 disabled:shadow-none flex items-center justify-center gap-2"
    >
      <span>Continue</span>
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
      </svg>
    </button>
  </div>

</div>
